[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pubtest"
version = "0.3.0"
description = "The Gherkin steps every Sustenaut suite shares, as a pytest-bdd plugin (and, from the same grammar, an npm package)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "David Schryer", email = "schryer@gmail.com" }]
dependencies = ["pytest>=8", "pytest-bdd>=8.1"]

[project.optional-dependencies]
# The record/replay harness (pubtest.cassettes), inert without it. Optional, so
# integrations' own suite, which runs on pubtest, makes no cycle.
integrations = ["integrations @ https://github.com/Sustenaut/integrations/releases/download/v0.16.0/integrations-0.16.0-py3-none-any.whl"]

[project.scripts]
pubtest = "pubtest.cli:main"

[project.urls]
Repository = "https://github.com/Sustenaut/pubtest"

[project.entry-points.pytest11]
pubtest = "pubtest.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# What a program a scenario runs loads, to report the recorded calls it used.
pubtest = ["_child/*.py", "_child/*.mjs"]

[tool.coverage.run]
# The package, not a directory named pubtest: a scenario's scratch directory
# has one (its stand-ins), which coverage would otherwise measure too.
source_pkgs = ["pubtest"]
# src/pubtest/_child, which `make functional` names: what a program a scenario
# runs loads as sitecustomize, outside the package's module names.
source_dirs = ["${PUBTEST_CHILD_DIR}"]
patch = ["subprocess"]
parallel = true

[tool.coverage.xml]
output = "coverage/coverage.xml"
