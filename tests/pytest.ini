[pytest]
bdd_features_base_dir = ../features/
testpaths = .
# The example test customer, registered by an entry point as a package's would be.
pythonpath = customers
# pubrules's own plugin, while a pubrules still carries one, is left out: pubtest
# is the plugin under test.
addopts = --strict-markers -ra -p no:pubrules -p pytester
